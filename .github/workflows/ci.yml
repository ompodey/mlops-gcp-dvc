name: Train model and report with CML

on:
  push:
    branches: [ main ]

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip install git+https://github.com/iterative/cml.git

      - name: Run training script
        run: |
          python src/train.py > report.txt
          echo "✅ Model training completed!" >> report.txt

      - name: Run tests
        run: pytest tests/ > test_results.txt

      - name: Create CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## 🧠 Model Training Report" > cml_report.md
          echo "### 🔹 Training Output" >> cml_report.md
          cat report.txt >> cml_report.md

          echo "### 🔹 Test Results" >> cml_report.md
          cat test_results.txt >> cml_report.md

          # Send the CML report as a comment on the Pull Request
          npx cml comment create cml_report.md
