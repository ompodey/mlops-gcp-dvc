name: IRIS CI Pipeline

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repo
    - name: Checkout Repo
      uses: actions/checkout@v3

    # 2. Setup Python
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Cache pip dependencies
  uses: actions/cache@v3
  with:
    path: ~/.cache/pip
    key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

    # 3. Install dependencies (stable and clean)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install "dvc[gdrive]" pytest==7.4.4 cml==0.9.7

    # 4. Pull DVC data & model
    - name: Pull DVC Data & Model
      run: dvc pull

    # 5. Run tests
    - name: Run Test Pipeline
      run: pytest tests/test_pipeline.py

    # 6. Generate and Post CML Report
    - name: Generate and Post CML Report
      if: github.event_name == 'pull_request'
      env:
        REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "### 🧪 Test Results" > report.md
        echo "" >> report.md
        cat metrics_test.csv >> report.md
        npx cml comment create report.md

